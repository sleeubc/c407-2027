<script>
// Let an ordinary mouse wheel scroll wide data-preview tables sideways.
document.addEventListener("wheel", function (event) {
  var box = event.target.closest &&
    event.target.closest(".data-preview .cell-output-display");
  if (!box || event.shiftKey) return;
  if (Math.abs(event.deltaX) >= Math.abs(event.deltaY)) return;
  if (box.scrollWidth <= box.clientWidth) return;
  if (box.scrollHeight > box.clientHeight) return;
  var step = event.deltaMode === 1 ? 40 : 1;
  box.scrollLeft += event.deltaY * step;
  event.preventDefault();
}, { passive: false });
</script>
